# Builds the desktop installers on each operating system, because an installer
# can only be built on the system it is for. Run it by hand to get them as
# workflow artifacts, or push a tag such as desktop-v0.2.0 to publish them as a
# GitHub release, which the website's /download/ page links to.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

# Read-only by default; only the release job may write, and only to releases.
# Actions are pinned to commits so a moved tag can't change what runs; Dependabot keeps the pins current.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates yet: see "Signing" in the README. The Mac build signs itself ad hoc.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm tutor:index && pnpm test:tutor
      - name: The tag and the app's version agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "desktop-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm desktop:dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyberdojo-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  # One job publishes everything, so the release appears complete, with the checksums of every file.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: CyberDojo ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
